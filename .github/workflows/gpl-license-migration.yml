name: GPL License Migration

on:
  push:
    branches:
      - hardening/public-oss-readiness-20260831

permissions:
  contents: write

jobs:
  migrate-license:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Fetch and verify canonical GPL-3.0 text
        shell: bash
        run: |
          set -euo pipefail
          upstream_commit="9b3b23b27c776910c2a0a12eebe58247e3371f7e"
          expected_blob="f288702d2fa16d3cdf0035b15a9fcbc552cd88e7"
          url="https://raw.githubusercontent.com/linyusenzz/HDRImageViewer/${upstream_commit}/LICENSE"
          curl --fail --silent --show-error --location "$url" --output LICENSE.canonical
          actual_blob="$(git hash-object LICENSE.canonical)"
          test "$actual_blob" = "$expected_blob"
          mv LICENSE.canonical LICENSE
          test "$(git hash-object LICENSE)" = "$expected_blob"

      - name: Commit exact license if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- LICENSE; then
            echo "LICENSE is already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LICENSE
          git commit -m "legal: install canonical GPL-3.0 license text"
          git push origin "HEAD:hardening/public-oss-readiness-20260831"
