name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore app
        run: dotnet restore .\src\HDRVideoPlayer.App\HDRVideoPlayer.App.csproj
      - name: Build app
        run: dotnet build .\src\HDRVideoPlayer.App\HDRVideoPlayer.App.csproj -c Debug --no-restore
      - name: Test core
        run: dotnet test .\tests\HDRVideoPlayer.Core.Tests\HDRVideoPlayer.Core.Tests.csproj -c Debug --no-restore
      - name: Public safety scan
        shell: pwsh
        run: .\scripts\public-safety-scan.ps1
