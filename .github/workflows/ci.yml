name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'
      - name: Restore app
        run: dotnet restore .\src\HDRVideoPlayer.App\HDRVideoPlayer.App.csproj
      - name: Build app
        run: dotnet build .\src\HDRVideoPlayer.App\HDRVideoPlayer.App.csproj -c Debug --no-restore
      - name: Test core
        run: dotnet test .\tests\HDRVideoPlayer.Core.Tests\HDRVideoPlayer.Core.Tests.csproj -c Debug --no-restore
      - name: Public safety scan
        shell: pwsh
        run: .\scripts\public-safety-scan.ps1
